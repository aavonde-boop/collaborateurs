<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0F172A;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow:hidden}
  .barre{position:fixed;top:0;left:0;right:0;z-index:10;background:linear-gradient(90deg,#0F172A,#1B3A6B);
    padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;display:flex;align-items:center;gap:8px}
  .titre{color:#fff;font-weight:800;font-size:14px;margin-right:6px;white-space:nowrap;display:flex;align-items:center;gap:7px}
  .titre i{display:inline-grid;grid-template-columns:7px 7px;gap:2px}
  .titre i b{width:7px;height:7px;border-radius:2px;background:#fff}.titre i b:nth-child(2),.titre i b:nth-child(3){background:#93C5FD}
  .onglets{display:flex;gap:6px;flex:1;min-width:0}
  .onglet{flex:1 1 0;min-width:0;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;
    padding:8px 10px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;overflow:hidden}
  .onglet.on{background:#fff;color:#0F172A;border-color:#fff}
  .onglet .n{background:#DC2626;color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;min-width:20px;text-align:center}
  .onglet .n:empty{display:none}
  .onglet .lbl{overflow:hidden;text-overflow:ellipsis}
  .recharger{border:none;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;width:38px;height:36px;font-size:16px;cursor:pointer;flex-shrink:0}
  iframe{position:fixed;left:0;right:0;bottom:0;width:100%;border:0;background:#F5F7FA;display:none}
  iframe.on{display:block}
  @media(max-width:520px){.titre span{display:none}.onglet{font-size:13px;padding:8px 6px}}
</style>
</head>
<body>
<div class="barre" id="barre">
  <div class="titre"><i><b></b><b></b><b></b><b></b></i><span>Mon espace</span></div>
  <div class="onglets">
    <button class="onglet" data-id="collab"><span>👥</span><span class="lbl">Collaborateurs</span><span class="n" id="n-collab"></span></button>
    <button class="onglet" data-id="services"><span>🍽️</span><span class="lbl">Services</span><span class="n" id="n-services"></span></button>
  </div>
  <button class="recharger" id="recharger" title="Recharger cet espace" aria-label="Recharger">↻</button>
</div>
<iframe id="f-collab" title="Gestion Collaborateurs" allow="camera; clipboard-write"></iframe>
<iframe id="f-services" title="Gestion des services" allow="camera; clipboard-write"></iframe>
<script>
// Mon espace : les deux applis restent ouvertes côte à côte ; on passe de l'une à l'autre sans recharger.
var ESPACES={collab:"../",services:"../../Projet/GestionCommandes/"};
var cles=Object.keys(ESPACES), actif=null;
function lire(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
function ecrire(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function placer(){var h=document.getElementById("barre").offsetHeight;cles.forEach(function(id){document.getElementById("f-"+id).style.top=h+"px";document.getElementById("f-"+id).style.height="calc(100% - "+h+"px)";});}
function ouvrir(id){
  var f=document.getElementById("f-"+id);
  if(!f.getAttribute("src"))f.setAttribute("src",ESPACES[id]);
  cles.forEach(function(k){document.getElementById("f-"+k).classList.toggle("on",k===id);});
  document.querySelectorAll(".onglet").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-id")===id);});
  actif=id;ecrire("espaceActif",id);
}
document.querySelectorAll(".onglet").forEach(function(b){b.addEventListener("click",function(){ouvrir(b.getAttribute("data-id"));});});
document.getElementById("recharger").addEventListener("click",function(){var f=document.getElementById("f-"+actif);try{f.contentWindow.location.reload()}catch(e){f.setAttribute("src",ESPACES[actif])}});
window.addEventListener("resize",placer);
placer();
// Les deux espaces se chargent dès l'ouverture (l'autre en arrière-plan) pour un passage instantané
ouvrir(lire("espaceActif","collab"));
setTimeout(function(){cles.forEach(function(k){var f=document.getElementById("f-"+k);if(!f.getAttribute("src"))f.setAttribute("src",ESPACES[k]);});},1500);
// Chiffres : lus dans le titre de chaque appli, « (4) Gestion… » ; total sur l'icône de Mon espace
function compter(){
  var total=0;
  cles.forEach(function(k){var n=0;try{var t=document.getElementById("f-"+k).contentDocument.title||"";var m=t.match(/^\((\d+)\)/);if(m)n=parseInt(m[1],10)}catch(e){}
    document.getElementById("n-"+k).textContent=n?String(n):"";total+=n;});
  document.title=(total?"("+total+") ":"")+"Mon espace";
  try{if("setAppBadge" in navigator){total?navigator.setAppBadge(total).catch(function(){}):navigator.clearAppBadge().catch(function(){})}}catch(e){}
}
setInterval(compter,3000);setTimeout(compter,2500);
</script>
</body>
