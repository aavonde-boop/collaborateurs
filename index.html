      return{...c,statut:"Occupé",occupant:occ,matricule:mat};
    });
  },[badges,casiers]);
  const repairRef=useRef(new Set());
  const[loading,setLoading]=useState(false);
  const[toast,setToast]=useState(null);
  const toastTimer=useRef(null);
  const racineRef=useRef(null);const hrRef=useRef(null);const hcmRef=useRef(null);const importJsonRef=useRef(null);
  
  // ── Auto-save ──
  const saveTimer=useRef(null);
  // Dernier état connu de chaque fiche côté base (id → contenu). La sauvegarde automatique
  // n'envoie que les fiches qui diffèrent de cet état : elle n'écrase plus les modifications
  // faites entre-temps par quelqu'un d'autre sur les fiches qu'on n'a pas touchées.
  const serverSnap=useRef({});const pendingSave=useRef(false);
  const snapBadges=list=>{const m={};(list||[]).forEach(b=>{if(b&&typeof b.id==="number")m[b.id]=JSON.stringify(b);});serverSnap.current=m;};
  const[saving,setSaving]=useState(false);

  // ── Auto-save badges — uniquement les badges avec un vrai ID Supabase (number) ──
  useEffect(()=>{
    if(!unlocked||!sb||!badges.length)return;
    if(saveTimer.current)clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(()=>{
      saveTimer.current=null;
      // FIX: ne jamais upsert les badges avec ID temporaire (string "tmp_...") ou ID local hors Supabase
      const rows=badges.filter(b=>b.id&&typeof b.id==="number"&&serverSnap.current[b.id]!==JSON.stringify(b));
      if(!rows.length)return;
      setSaving(true);pendingSave.current=true;
      (async()=>{try{
        const rs=await Promise.all(rows.map(b=>sb.from("lp24_badges").upsert(b,{onConflict:"id"})));
        rows.forEach((b,i)=>{if(!(rs[i]&&rs[i].error))serverSnap.current[b.id]=JSON.stringify(b);});
        if(rs.some(r=>r&&r.error))showToast("⚠️ Pas sauvegardé (collaborateur) — vérifie le réseau et réessaie","err");
        setTimeout(()=>setSaving(false),800);
      }catch(e){setSaving(false);}finally{pendingSave.current=false;}})();
    },2000);
  },[badges,unlocked]);

  // ── Auto-transition "À récupérer" : UNIQUEMENT quand la sortie est à J-7 ──
  // Bascule dans les deux sens : Actif→À récupérer en entrant dans la fenêtre des 7 jours,
  // et À récupérer→Actif si la date de sortie a été repoussée à plus de 7 jours (la personne
  // ne part plus si vite). On ne touche jamais aux fiches sans date de sortie, ni à celles déjà
  // en retard (date passée, statut "À récupérer" conservé tant que le badge n'est pas récupéré).
  useEffect(()=>{
    if(!unlocked||!badges.length)return;
    const today=todayISO();
    const j7=new Date();j7.setDate(j7.getDate()+7);const j7ISO=j7.toISOString().slice(0,10);
    const versARecuperer=badges.filter(b=>b.statut==="Actif"&&b.date_sortie_prevue&&b.date_sortie_prevue<=j7ISO&&b.date_sortie_prevue>=today);
    const versActif=badges.filter(b=>b.statut==="À récupérer"&&b.date_sortie_prevue&&b.date_sortie_prevue>j7ISO);
    if(!versARecuperer.length&&!versActif.length)return;
    const idsRec=new Set(versARecuperer.map(b=>b.id));
    const idsAct=new Set(versActif.map(b=>b.id));
    setBadges(prev=>prev.map(b=>{
      if(idsRec.has(b.id))return{...b,statut:"À récupérer"};
      if(idsAct.has(b.id))return{...b,statut:"Actif"};
      return b;
    }));
    versARecuperer.forEach(b=>{
      if(sb&&typeof b.id==="number")sbFire(sb.from("lp24_badges").upsert({...b,statut:"À récupérer"}),"collaborateur");
      addLog("Statut auto","À récupérer (sortie le "+fmt(b.date_sortie_prevue)+") — "+b.prenom+" "+b.nom);
    });
    versActif.forEach(b=>{
      if(sb&&typeof b.id==="number")sbFire(sb.from("lp24_badges").upsert({...b,statut:"Actif"}),"collaborateur");
      addLog("Statut auto","Actif (sortie repoussée au "+fmt(b.date_sortie_prevue)+") — "+b.prenom+" "+b.nom);
    });
    if(versARecuperer.length)showToast("🔴 "+versARecuperer.length+" badge(s) passé(s) en « À récupérer » (sortie ≤ 7 jours)");
    if(versActif.length)showToast("✅ "+versActif.length+" badge(s) repassé(s) en « Actif » (sortie > 7 jours)");
  },[badges,unlocked]);

  // ── Auto-save FSS désactivé — chaque action sauvegarde individuellement ──
  // (upsert global risqué si IDs locaux ≠ IDs Supabase)

  // ── Exposer fssEmail pour EmailJS ──
  useEffect(()=>{window._fssNotifEmail=settings.fssEmail||"";},[settings.fssEmail]);
  useEffect(()=>{window._mailSignature=texteMail(settings,"autoSignature");},[settings.autoSignature]);
  useEffect(()=>{window._mailIT=settings.itEmail||"";},[settings.itEmail]);

  // ── Migration ponctuelle : mettre en MAJUSCULES les champs texte déjà enregistrés ──
  // Ne touche jamais : statut, zone, dates, id, booléens (utilisés en comparaisons strictes).
  // "casier"/"numero" sont migrés ensemble pour ne pas casser le lien casier ↔ collaborateur.
  const migratedRef=useRef(false);
  useEffect(()=>{
    if(dbStatus!=="ok"||migratedRef.current)return;
    migratedRef.current=true;
    const FIELDS_B=["nom","prenom","email","serie","zeplug","carte_rechargement","manager","mail_manager","matricule","casier"];
    const FIELDS_C=["occupant","matricule","numero"];
    // Field Support : uniquement les champs texte libre (jamais situation/statut/lieu/matPC/matRecu/matDonne,
    // qui sont des listes déroulantes à valeurs fixes — les majusculer casserait la sélection).
    const FIELDS_FSS=["nom","prenom","manager","ritm","idMat","commentaires"];
    setBadges(prev=>{
      let changed=false;
      const upd=prev.map(b=>{
        let nb=null;
        FIELDS_B.forEach(f=>{const v=b[f];if(typeof v==="string"&&v&&v!==v.toUpperCase()){if(!nb)nb={...b};nb[f]=v.toUpperCase();}});
        if(nb){changed=true;if(sb&&typeof b.id==="number")sbFire(sb.from("lp24_badges").upsert(nb),"collaborateur");return nb;}
        return b;
      });
      return changed?upd:prev;
    });
    setCasiers(prev=>{
      let changed=false;
      const upd=prev.map(c=>{
        let nc=null;
        FIELDS_C.forEach(f=>{const v=c[f];if(typeof v==="string"&&v&&v!==v.toUpperCase()){if(!nc)nc={...c};nc[f]=v.toUpperCase();}});
        if(nc){changed=true;if(sb&&typeof c.id==="number")sbFire(sb.from("lp24_casiers").upsert(nc),"casier");return nc;}
        return c;
      });
      return changed?upd:prev;
    });
    setFssData(prev=>{
      let changed=false;
      const upd=(prev||[]).map(f=>{
        let nf=null;
        FIELDS_FSS.forEach(k=>{const v=f[k];if(typeof v==="string"&&v&&v!==v.toUpperCase()){if(!nf)nf={...f};nf[k]=v.toUpperCase();}});
        if(nf){changed=true;if(sb&&typeof f.id==="number")sbFire(sb.from("lp24_fss").upsert(nf,{onConflict:"id"}),"fiche Field Support");return nf;}
        return f;
      });
      return changed?upd:prev;
    });
  },[dbStatus]);

  // ── Corrige en base les casiers marqués "Libre" alors qu'un collaborateur les a ──
  useEffect(()=>{
    if(dbStatus!=="ok"||!sb)return;
    const diffs=casiersEff.filter((c,i)=>c!==casiers[i]&&typeof c.id==="number"&&!repairRef.current.has(c.numero));
    if(!diffs.length)return;
    diffs.forEach(d=>repairRef.current.add(d.numero));
    (async()=>{
      try{
        const{error}=await sb.from("lp24_casiers").upsert(diffs);
        if(error)throw error;
        const byId={};diffs.forEach(d=>{byId[d.id]=d;});
        setCasiers(p=>p.map(c=>byId[c.id]?{...c,...byId[c.id]}:c));
      }catch(e){console.error("réparation casiers",e);}
      finally{diffs.forEach(d=>repairRef.current.delete(d.numero));}
    })();
  },[casiersEff,casiers,dbStatus]);

  // ── Rafraîchit les données quand l'appli revient au premier plan (et toutes les 2 min),
  // pour ne pas travailler sur une liste de casiers périmée sur téléphone. ──
  useEffect(()=>{
    if(!unlocked||!sb)return;
    let last=Date.now();
    const refresh=async()=>{
      if(document.visibilityState!=="visible"||Date.now()-last<20000||pendingSave.current||saveTimer.current)return;
      last=Date.now();
      try{
        const[bRes,cRes]=await Promise.all([sb.from("lp24_badges").select("*").order("id"),sb.from("lp24_casiers").select("*").order("id")]);
        if(bRes.error||cRes.error)return;
        {const d=bRes.data||[];snapBadges(d);setBadges(d);}
        const m={};(cRes.data||[]).forEach(c=>{if(c.numero)m[c.numero]=c;});
        setCasiers(Object.values(m));
      }catch(e){}
    };
    document.addEventListener("visibilitychange",refresh);window.addEventListener("focus",refresh);
    const t=setInterval(refresh,120000);
    return()=>{document.removeEventListener("visibilitychange",refresh);window.removeEventListener("focus",refresh);clearInterval(t);};
  },[unlocked]);

  // ── Auto-save settings (users, emails) dans Supabase ──
  const settingsTimer=useRef(null);
  useEffect(()=>{
    if(!unlocked||!sb)return;

      (async()=>{try{await sb.from("lp24_settings").upsert({id:1,data:JSON.stringify(settings)});}catch(e){}})();
    },1500);

  const showToast=(msg,type="ok")=>{if(toastTimer.current)clearTimeout(toastTimer.current);setToast({msg,type});toastTimer.current=setTimeout(()=>setToast(null),3500);};
  window.__sbErr=label=>showToast("⚠️ Pas sauvegardé ("+label+") — vérifie le réseau et réessaie","err");
  const addLog=useCallback((action,detail)=>{
  const entry={id:Date.now(),ts:TS(),action,detail,user:session?session.label:"admin"};
  setHisto(prev=>[entry,...prev].slice(0,300));
  if(sb){(async()=>{try{const r=await sb.from("historique").insert({action,detail,user_email:session?session.label:"admin",ts:new Date().toISOString()});if(r.error)console.error("historique insert error:",JSON.stringify(r.error));}catch(e){console.error("historique insert exception:",e);}})();}
},[session]);

  // Expose file handlers for SettingsModal
  useEffect(()=>{
    window._handleRacine=(file)=>{parseRacineAsync(file,badges,setBadges,setCasiers,showToast,setLoading,addLog);setShowSettings(false);};
    window._handleHR=(file,type)=>{parseWDFileAsync(file,type,wdCache,setWdCache,showToast,setLoading);setShowSettings(false);};
    window._onWdImport=(parsed)=>{
      // Chercher badges sans matricule et les matcher avec Workday
      setBadges(prev=>{
        const updated=[...prev];const newIds=new Set();
        updated.forEach((b,i)=>{
          if(b.matricule&&String(b.matricule)!=="0")return;
          const n=b.nom.toUpperCase();const p=(b.prenom||"").toLowerCase();
          const match=parsed.find(w=>(w.nom.toUpperCase().includes(n)||n.includes(w.nom.toUpperCase()))&&(w.prenom.toLowerCase().includes(p)||p.includes(w.prenom.toLowerCase())));
          if(match&&match.matricule){updated[i]={...b,matricule:match.matricule,email:b.email||match.email,manager:b.manager||match.manager,mail_manager:b.mail_manager||match.mailMgr};newIds.add(b.id);if(sb)sbFire(sb.from("lp24_badges").upsert(updated[i]),"collaborateur");}
        });
        if(newIds.size>0)setNewMats(prev2=>new Set([...prev2,...newIds]));
        // ── Mémoriser le résultat de la synchro auto pour l'afficher sur l'accueil ──
        setSettings(s=>({...s,wdAutoUpdateMeta:{date:new Date().toISOString(),count:newIds.size,noms:updated.filter(b=>newIds.has(b.id)).map(b=>b.prenom+" "+b.nom)}}));
        return updated;
      });
    };
    window._onWdImportMeta=(meta)=>{setSettings(s=>({...s,wdImportMeta:meta}));addLog("Import Workday",meta.count+" ligne(s) — "+(meta.type==="hr"?"HR Data":"Future Hires")+" ("+meta.fileName+")");};
  },[badges,wdCache,addLog]);

useEffect(()=>{
    if(!unlocked)return;
    if(!sb){setDbStatus("error");return;}
    async function load(){
      try{
        const[bRes,cRes]=await Promise.all([sb.from("lp24_badges").select("*").order("id"),sb.from("lp24_casiers").select("*").order("id")]);
        if(bRes.error)throw bRes.error;
        {const d=bRes.data||[];snapBadges(d);setBadges(d);}
        // Dédupliquer les casiers par numéro (protection contre les doublons Supabase)
        const rawCasiers=cRes.data||[];
        const casiersMap={};rawCasiers.forEach(c=>{if(c.numero)casiersMap[c.numero]=c;});
        setCasiers(Object.values(casiersMap));
        
        // Charger les paramètres persistants (users, emails)
        try{
          const {data:sData}=await sb.from("lp24_settings").select("*").eq("id",1).single();
          if(sData&&sData.data){
            const parsed=typeof sData.data==="string"?JSON.parse(sData.data):sData.data;
            setSettings(prev=>({...prev,...parsed}));
          }
        }catch(se){console.log("Settings non trouvés (normal au 1er démarrage)",se);}
        
        // Charger l'historique
        const { data: histoData } = await sb.from("historique").select("*").order("id", { ascending: false }).limit(500);
        if(histoData){
          setHisto(histoData.map(h => ({...h, ts: new Date(h.ts).toLocaleString("fr-FR")})));
        } else {
          setHisto([]);
        }

        // ── FIX: Restaurer wdCache depuis Supabase (id:2) ──
        try{
          const {data:wdData}=await sb.from("lp24_settings").select("*").eq("id",2).single();
          if(wdData&&wdData.data){const parsed=typeof wdData.data==="string"?JSON.parse(wdData.data):wdData.data;if(parsed&&Object.keys(parsed).length>0)setWdCache(parsed);}
        }catch(we){console.log("wdCache non trouvé (normal au 1er démarrage)",we);}

        // Charger les fiches Field Support — pagination par blocs de 1000 (limite Supabase)
        try{
          let allFss=[];let from=0;const pageSize=1000;let hasMore=true;
          while(hasMore){
            const fssRes=await sb.from("lp24_fss").select("*").order("id").range(from,from+pageSize-1);
            if(fssRes.error){console.error("FSS load error:",JSON.stringify(fssRes.error));break;}
            const rows=fssRes.data||[];
            allFss=[...allFss,...rows];
            hasMore=rows.length===pageSize;
            from+=pageSize;
          }
          setFssData(allFss);
          console.log("FSS chargé:",allFss.length,"fiches");
        }catch(fe){console.error("FSS load exception:",fe);}
        
        setDbStatus("ok");
      }
      catch(e){
        console.log("Erreur chargement:", e);
        setDbStatus("error");
      }
    }
    load();
  },[unlocked]);

  const exportExcel=useCallback(()=>{
    if(typeof XLSX==="undefined"){alert("XLSX non disponible");return;}
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(badges.map(b=>({Matricule:b.matricule,Nom:b.nom,Prénom:b.prenom,Email:b.email||"","N° Badge (Série)":b.serie||"","Carte rechargement":b.carte_rechargement||"",Casier:b.casier||"",Manager:b.manager||"","Email Manager":b.mail_manager||"",Statut:b.statut,"Date sortie":b.date_sortie_prevue||"","Archivé le":b.date_archive||"",Commentaire:b.commentaire||""}))),
    "Collaborateurs");
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(casiers.map(c=>({Zone:c.zone,"N° Casier":c.numero,Occupant:c.occupant||"",Statut:c.statut}))),
    "Casiers");
    XLSX.writeFile(wb,"Collaborateurs_"+todayISO()+".xlsx");
    addLog("Export Excel",badges.length+" collaborateurs, "+casiers.length+" casiers");
    showToast("✅ Export Excel effectué");
  },[badges,casiers,addLog]);

  const exportJSON=useCallback(()=>{
    // Inclure wdCache dans la sauvegarde
    const d={version:4,date:new Date().toISOString(),badges,casiers,wdCache:wdCache||{}};
    const blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="Sauvegarde_Collaborateurs_"+todayISO()+".json";document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
    addLog("Export JSON",badges.length+" collaborateurs, "+casiers.length+" casiers (sauvegarde complète)");
    showToast("✅ Sauvegarde JSON téléchargée (Workday inclus)");
  },[badges,casiers,wdCache,addLog]);

  const importJSON=useCallback(e=>{
    const file=e.target.files[0];if(!file)return;

      try{
        const data=JSON.parse(ev.target.result);

        if(!confirm("Remplacer toutes les données par ce fichier JSON ?"))return;
        const b=data.badges||data.collaborateurs||[];const c=data.casiers||[];
        const wd=data.wdCache&&Object.keys(data.wdCache).length>0?data.wdCache:null;
        if(wd){setWdCache(wd);if(sb)(async()=>{try{await sb.from("lp24_settings").upsert({id:2,data:JSON.stringify(wd)});}catch(e){}})();}
        if(sb){
          setLoading(true);
          // 1. Dédupliquer les badges : garder le dernier Actif par matricule, sinon par nom+prénom
          const bDedup=(()=>{
            const byMat={};const byName={};
