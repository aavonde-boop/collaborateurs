<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Gestion Collaborateurs</title>
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <!-- Appli sur l'écran d'accueil (iPhone / Android) -->
  <link rel="manifest" href="manifest.webmanifest?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="https://aavonde-boop.github.io/collaborateurs/apple-touch-icon.png?v=2">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="https://aavonde-boop.github.io/collaborateurs/apple-touch-icon-precomposed.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Collaborateurs">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F5F7FA">
  <meta name="format-detection" content="telephone=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --bg:#F5F7FA;--surface:#FFFFFF;--surface2:#F0F2F5;--surface3:#E8EBF0;
      --border:#DDE1E7;--border2:#C8CDD6;
      --text:#1A1F2E;--text2:#4A5568;--text3:#718096;
      --accent:#3B82F6;--accent2:#2563EB;--accentBg:rgba(59,130,246,.1);
      --green:#16A34A;--greenBg:rgba(22,163,74,.1);
      --red:#DC2626;--redBg:rgba(220,38,38,.1);
      --orange:#EA580C;--orangeBg:rgba(234,88,12,.1);
      --purple:#9333EA;--purpleBg:rgba(147,51,234,.1);
      --yellow:#CA8A04;--yellowBg:rgba(202,138,4,.1);
      --cyan:#0891B2;--cyanBg:rgba(8,145,178,.1);
      --orange:#EA580C;--orangeB:rgba(234,88,12,.1);
      --radius:10px;--radius-sm:6px;--radius-lg:14px;
      /* ── Teintes arrivée / départ (accueil), adoucies pour ne pas agresser l'œil ── */
      --arr:#4C9A7C;--arr-bg:#EAF5EF;--arr-soft:#CFE9DC;
      --dep:#BD5F77;--dep-bg:#FBEAEF;--dep-soft:#F2D2DC;
    }
    body.dark{
      --bg:#0B1220;--surface:#141B2E;--surface2:#1B2338;--surface3:#242D47;
      --border:#2A3350;--border2:#394468;
      --text:#E7EBF4;--text2:#AEB7CC;--text3:#7A86A3;
      --accentBg:rgba(59,130,246,.18);--greenBg:rgba(22,163,74,.18);--redBg:rgba(220,38,38,.18);
      --orangeBg:rgba(234,88,12,.18);--purpleBg:rgba(147,51,234,.18);--yellowBg:rgba(202,138,4,.18);--cyanBg:rgba(8,145,178,.18);
      --arr-bg:rgba(76,154,124,.18);--arr-soft:rgba(76,154,124,.35);
      --dep-bg:rgba(189,95,119,.18);--dep-soft:rgba(189,95,119,.35);
    }
    body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .2s,color .2s;}
    button,input,select,textarea{font-family:inherit;}
    table{border-spacing:0;}
    ::-webkit-scrollbar{width:5px;height:5px;}
    ::-webkit-scrollbar-track{background:var(--surface2);}
    ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
    ::-webkit-scrollbar-thumb:hover{background:#555;}
    @keyframes toastIn{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    .toast-anim{animation:toastIn .25s ease forwards;}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .anim-in{animation:fadeIn .3s ease forwards;}
    @media(max-width:768px){.desktop-nav{display:none!important}.mobile-nav{display:flex!important}main{padding:12px!important;padding-bottom:calc(80px + env(safe-area-inset-bottom))!important}}
    @media(min-width:769px){.mobile-nav{display:none!important}}
    .mobile-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);display:none;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -1px 0 var(--border),0 -8px 24px rgba(0,0,0,.08);z-index:1000;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}.mobile-nav::-webkit-scrollbar{display:none;}
    @media print{.no-print{display:none!important}body{background:#fff;color:#000}.badge-card{page-break-inside:avoid;break-inside:avoid;}}
    .print-only{display:none;}
    @media print{.print-only{display:block!important}}
    input[type="file"]{display:none;}
    th.sortable{cursor:pointer;user-select:none;}
    th.sortable:hover{background:rgba(0,0,0,.04);}
    .sort-asc::after{content:" ↑";font-size:10px;opacity:.6;}
    .sort-desc::after{content:" ↓";font-size:10px;opacity:.6;}
    .notif-bar{animation:pulse 3s infinite;}
    @keyframes savePulse{0%,100%{opacity:1}50%{opacity:.2}}
    .save-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);}
    .save-dot.saving{animation:savePulse 0.8s ease infinite;background:var(--yellow);}
    @media(max-width:768px){.tbl-desktop{display:none!important}.cards-mobile{display:block!important}}
    @media(min-width:769px){.cards-mobile{display:none!important}}
    @media(max-width:1000px){.rapport-cols{grid-template-columns:1fr!important}}
    /* ── Lisibilité mobile, sans toucher aux vues : uniquement des overrides CSS ── */
    @media(max-width:768px){
      /* En dessous de 16px, Safari iOS zoome automatiquement sur un champ au focus */
      input,select,textarea{font-size:16px!important;}
      /* Beaucoup de tableaux (Rapport, Casiers, Badges Prêt, Historique, Archives, Field Support)
         sont pensés pour un écran d'ordinateur et affichent un texte minuscule sur téléphone.
         On agrandit le texte ; les tableaux qui ne tiennent pas défilent horizontalement
         (la plupart sont déjà dans un conteneur overflow:auto). */
      table{font-size:14px!important;}
      table th{font-size:12px!important;}
      table td{font-size:13px!important;}
      .lbl{font-size:12px!important;}
      .btn,.btn-icon,.badge,.nav-item{font-size:13px!important;}
      .mob-row{font-size:13px!important;}
    }
    .mob-card{background:var(--surface2);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;border-left:3px solid var(--accent);}
    .mob-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px;border-bottom:1px solid var(--border);}
    .mob-row:last-child{border-bottom:none;}
    .mob-lbl{color:var(--text3);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
    .cards-mobile{display:none;}
    /* Card & Button design system from index-5 */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;border:none;}
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-primary:hover{background:#2563EB;}
    .btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text2);}
    .btn-outline:hover{background:var(--surface2);border-color:var(--text3);color:var(--text);}
    .btn-danger{background:var(--redBg);border:1px solid rgba(220,38,38,.25);color:var(--red);}
    .btn-success{background:var(--greenBg);border:1px solid rgba(22,163,74,.25);color:var(--green);}
    .btn-icon{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:16px;line-height:1;transition:all .15s;color:var(--text2);}
    .btn-icon:hover{background:var(--surface2);border-color:var(--border2);}
    .inp{width:100%;padding:7px 11px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface2);color:var(--text);font-size:13px;transition:border-color .15s;}
    .inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.1);}
    .inp::placeholder{color:var(--text3);}
    .lbl{font-size:11px;font-weight:600;color:var(--text2);display:block;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;}
    .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
    .kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;transition:all .2s;}
    .kpi-card:hover{border-color:var(--border2);transform:translateY(-1px);}
    .kpi-card.clickable{cursor:pointer;}
    .modal-overlay{position:fixed;inset:0;background:rgba(30,40,60,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);overflow:hidden;}
    .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;width:100%;max-width:820px;max-height:92vh;overflow-y:auto;}
    .nav-item{position:relative;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;border:none;background:transparent;color:var(--text2);white-space:nowrap;display:flex;align-items:center;gap:5px;}
    .nav-item:hover{background:rgba(0,0,0,.05);color:var(--text);}
    .nav-item.active{background:rgba(59,130,246,.15);color:var(--accent2);border:1px solid rgba(59,130,246,.25);}
    /* FSS status badges */
    .fss-status-terminee{background:rgba(22,163,74,.15);color:#16A34A;border:1px solid rgba(22,163,74,.25);}
    .fss-status-atraiter{background:rgba(220,38,38,.15);color:#DC2626;border:1px solid rgba(220,38,38,.25);}
    .fss-status-encours{background:rgba(202,138,4,.15);color:#CA8A04;border:1px solid rgba(202,138,4,.25);}
    .fss-status-suspendue{background:rgba(113,128,150,.15);color:#718096;border:1px solid rgba(113,128,150,.25);}
    .fss-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);transition:all .15s;}
    .fss-card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.08);}
    .settings-tab{padding:8px 14px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;border:none;background:transparent;color:var(--text2);}
    .settings-tab.active{background:var(--accentBg);color:var(--accent2);border:1px solid rgba(59,130,246,.2);}
    .settings-tab:hover:not(.active){background:var(--surface2);color:var(--text);}
    .new-badge-pulse{animation:newPulse 2s infinite;}
  @keyframes newPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.8;transform:scale(1.08)}}

  /* ════════════════ ACCUEIL — refonte (header, mouvements, calendrier, etc.) ════════════════ */
  .hero{background:linear-gradient(135deg,#0F172A,#1B3A6B);border-radius:12px;padding:14px 18px;color:#fff;}
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
  .hero h1{font-size:18px;font-weight:700;margin-bottom:3px;}
  .hero .greet{font-size:12px;color:rgba(255,255,255,.75);}
  .hero .anniv-line{font-size:12px;color:#FBBF24;font-weight:700;margin-top:3px;}
  .hero-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .j1-btn,.export-btn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;}
  .theme-toggle{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 10px;cursor:pointer;font-size:12px;color:#fff;font-weight:600;}
  .search-tabs{display:flex;gap:6px;margin-top:14px;}
  .search-tab{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.72);border-radius:999px;padding:4px 13px;font-size:11px;font-weight:700;cursor:pointer;}
  .search-tab.active{background:rgba(255,255,255,.24);color:#fff;}
  .hero-search-wrap{position:relative;margin-top:8px;max-width:420px;}
  .hero-search-wrap input{width:100%;padding:10px 14px 10px 36px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:13px;font-weight:600;outline:none;}
  .hero-search-wrap input::placeholder{color:rgba(255,255,255,.55);font-weight:500;}
  .hero-search-wrap .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.65);font-size:13px;}
  .hero-search-dd{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.25);overflow:hidden;z-index:40;max-height:260px;overflow-y:auto;}
  .hero-search-dd .r{display:flex;align-items:center;gap:9px;padding:8px 12px;cursor:pointer;color:var(--text);border-bottom:1px solid var(--border);}
  .hero-search-dd .r:last-child{border:none;}
  .hero-search-dd .r:hover{background:var(--surface2);}
  .hero-search-dd .av{width:26px;height:26px;border-radius:50%;background:var(--accentBg);color:var(--accent);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .hero-search-dd .nm{font-size:12.5px;font-weight:700;flex:1;}
  .hero-search-dd .st{font-size:10.5px;color:var(--text3);}

  .news-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .news-card{padding:14px 16px;border-top:3px solid var(--accent);cursor:pointer;}
  .news-card .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .news-card .ico{font-size:18px;}
  .news-card .cnt{font-size:20px;font-weight:800;margin-left:auto;}
  .news-card .ttl{font-size:12.5px;font-weight:700;}
  .news-card .sub{font-size:11px;color:var(--text3);margin-top:2px;}

  .banners-row{display:flex;flex-wrap:wrap;gap:10px;}
  .banner{flex:1;min-width:220px;display:flex;align-items:center;gap:11px;border-radius:var(--radius-lg);padding:10px 14px;border:1px solid;}
  .banner .ico{font-size:18px;flex-shrink:0;}
  .banner .txt{font-size:12px;font-weight:700;}
  .banner .sub{font-size:10.5px;margin-top:1px;font-weight:600;}
  .banner.bravo{background:var(--arr-bg);border-color:var(--arr-soft);}
  .banner.bravo .txt{color:#2E6B52;}body.dark .banner.bravo .txt{color:#8FD7B9;}
  .banner.bravo .sub{color:var(--arr);}
  .banner.anniv{background:var(--yellowBg);border-color:#F3DFA1;}
  .banner.anniv .txt{color:#8A6400;}body.dark .banner.anniv .txt{color:#F0CE6E;}
  .banner.anniv .sub{color:var(--yellow);}
  .banner.tip{background:var(--accentBg);border-color:#BFDBFE;}
  .banner.tip .txt{color:#1E4F9C;}body.dark .banner.tip .txt{color:#9DC2F7;}
  .banner.tip .sub{color:var(--accent);}

  .mvt-icon-row{display:flex;gap:10px;}
  .mvt-icon{flex:1;display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:11px 16px;cursor:pointer;transition:all .15s;}
  .mvt-icon:hover{border-color:var(--border2);transform:translateY(-1px);}
  .mvt-icon .ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .mvt-icon.arr .ico{background:var(--arr-bg);}
  .mvt-icon.dep .ico{background:var(--dep-bg);}
  .mvt-icon .ttl{font-weight:800;font-size:13.5px;}
  .mvt-icon .sub{font-size:10.5px;color:var(--text3);margin-top:1px;}
  .mvt-icon .tag{margin-left:auto;font-size:10px;font-weight:700;color:var(--arr);background:var(--arr-bg);border-radius:999px;padding:3px 9px;}

  .todo-card{padding:14px 18px;}
  .todo-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .todo-top h3{font-size:14px;font-weight:800;}
  .todo-top .cnt{margin-left:auto;font-size:11px;color:var(--text3);font-weight:700;}
  .todo-item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
  .todo-item:last-child{border-bottom:none;}
  .todo-check{width:18px;height:18px;border-radius:5px;border:2px solid var(--border2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:all .15s;}
  .todo-item.done .todo-check{background:var(--arr);border-color:var(--arr);}
  .todo-item.done .todo-txt{text-decoration:line-through;color:var(--text3);}
  .todo-txt{flex:1;font-size:12.5px;font-weight:600;}
  .todo-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;}

  .mvt-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start;}
  .mvt-arrivee{background:linear-gradient(160deg,var(--surface),var(--arr-bg) 140%);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;position:relative;}
  .mvt-arrivee::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;border-radius:var(--radius-lg) var(--radius-lg) 0 0;background:var(--arr);}
  .mvt-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .mvt-head .ico{width:34px;height:34px;border-radius:9px;background:var(--arr-bg);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  .mvt-head .ttl{font-weight:800;font-size:15px;}
  .mvt-head .sub{font-size:11px;color:var(--text3);margin-top:1px;}
  .wd-search{position:relative;margin-bottom:12px;}
  .wd-search label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px;}
  .wd-search-input{position:relative;}
  .wd-search-input input{width:100%;padding:11px 38px 11px 14px;border-radius:999px;border:1.5px solid var(--arr);background:var(--surface);color:var(--text);font-size:14px;font-weight:600;outline:none;}
  .wd-search-input input::placeholder{color:var(--text3);font-weight:500;}
  .wd-search-input .ic{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--arr);font-size:15px;pointer-events:none;}
  .wd-dropdown{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 8px 24px rgba(20,30,50,.18);z-index:30;max-height:260px;overflow-y:auto;}
  .wd-row{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);}
  .wd-row:last-child{border-bottom:none;}
  .wd-row:hover{background:var(--arr-bg);}
  .wd-av{width:30px;height:30px;border-radius:50%;background:var(--accentBg);color:var(--accent);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .wd-row .nm{font-size:13px;font-weight:700;flex:1;}
  .wd-row .meta{font-size:10.5px;color:var(--text3);text-align:right;}
  .wd-badge{display:inline-flex;align-items:center;gap:5px;background:var(--arr-bg);color:var(--arr);font-size:11px;font-weight:700;padding:5px 11px;border-radius:999px;margin-bottom:12px;}
  .wd-badge button{background:none;border:none;color:var(--arr);font-weight:800;cursor:pointer;font-size:12px;margin-left:2px;}
  .mvt-fields{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px;}
  .mvt-fields .full{grid-column:1/-1;}
  .fld label{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:4px;}
  .mvt-actions{display:flex;gap:8px;margin-top:4px;}
  .btn-main{flex:1;background:var(--arr);color:#fff;border:none;border-radius:999px;padding:10px 0;font-weight:700;font-size:13px;cursor:pointer;}
  .btn-ghost{background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:999px;padding:10px 14px;font-weight:700;font-size:12px;cursor:pointer;}
  .mvt-depart{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;position:relative;}

function parseWDFileAsync(file,type,wdCache,setWdCache,showToast,setLoading){
  setLoading(true);
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:"binary"});
      let wsName=wb.SheetNames[0];
      const wdTab=wb.SheetNames.find(s=>s.toLowerCase().includes("workday"));
      if(wdTab)wsName=wdTab;
      const ws=wb.Sheets[wsName];
      // Fix dimension A1:A1
      const cellKeys=Object.keys(ws).filter(k=>!k.startsWith("!"));
      if(cellKeys.length>0){
        let maxR=0,maxC=0;
        cellKeys.forEach(addr=>{try{const d=XLSX.utils.decode_cell(addr);if(d.r>maxR)maxR=d.r;if(d.c>maxC)maxC=d.c;}catch(e){}});
        ws["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:maxR,c:maxC}});
      }
      const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      let hRow=-1;
      for(let i=0;i<Math.min(data.length,30);i++){
        const row=data[i];
        if(!Array.isArray(row)||!row.length)continue;
        if(row.some(v=>String(v||"").toLowerCase().replace(/\s+/g," ").trim()==="employee id")){hRow=i;break;}
      }
      if(hRow<0){
        const preview=data.slice(0,5).map((r,i)=>i+": "+JSON.stringify(r).slice(0,80)).join("\n");
        alert("Colonne 'Employee ID' introuvable.\nFichier: "+file.name+"\n\nContenu:\n"+preview);
        setLoading(false);return;
      }
      const headers=data[hRow].map(h=>String(h||"").trim());
      const rows=data.slice(hRow+1).filter(r=>Array.isArray(r)&&r.some(v=>v!==""&&v!==null));
      const parsed=[];
      rows.forEach(r=>{
        const o={};headers.forEach((h,i)=>{if(h)o[h]=r[i]!==undefined&&r[i]!==null?r[i]:"";});
        const mat=String(o["Employee ID"]||"").trim();
        const nom=norm(String(o["Preferred Name - Last Name"]||""));

// ── Microsoft Lists CSV parser ──
function parseMSListsCSV(text){
  const lines=text.split(/\r?\n/);if(lines.length<2)return[];
  const sep=lines[0].includes(";")?";":",";
  const parseHeaders=line=>{const cols=[];let cur="";let inQ=false;for(const ch of line){if(ch==='"')inQ=!inQ;else if(ch===sep&&!inQ){cols.push(cur.replace(/^"|"$/g,"").trim());cur="";}else cur+=ch;}cols.push(cur.replace(/^"|"$/g,"").trim());return cols;};
  const parseLine=line=>{const cols=[];let cur="";let inQ=false;for(const ch of line){if(ch==='"')inQ=!inQ;else if(ch===sep&&!inQ){cols.push(cur.replace(/^"|"$/g,"").trim());cur="";}else cur+=ch;}cols.push(cur.replace(/^"|"$/g,"").trim());return cols;};
  const headers=parseHeaders(lines[0]);
  return lines.slice(1).filter(l=>l.trim()).map((line,idx)=>{const cols=parseLine(line);const o={_idx:idx};headers.forEach((h,i)=>{o[h]=cols[i]||"";});return o;});
}

// ════════════════ VUE RAPPORT ════════════════
function VueRapport({badges,fssData,setBadges,setFssData,showToast,addLog,setView,setPendingOpen}){
  const today=todayISO();
  const fmtD=d=>d?new Date(d).toLocaleDateString("fr-FR"):"—";
  const keyOf=(n,p)=>norm(n)+"|"+norm(p);

  // ── Collaborateurs : futurs départs (date_sortie_prevue >= aujourd'hui)
  const futursDeparts=useMemo(()=>
    badges.filter(b=>b.date_sortie_prevue&&b.date_sortie_prevue>=today&&b.statut!=="Archivé")
  ,[badges,today]);

  // ── Collaborateurs : futures arrivées (date_entree >= aujourd'hui)
  const futuresArrivees=useMemo(()=>
    badges.filter(b=>b.date_entree&&b.date_entree>=today&&b.statut!=="Archivé")
  ,[badges,today]);

  // ── FSS : futures arrivées (situation=Arrivée, dateEvt >= aujourd'hui)
  const fssArrivees=useMemo(()=>
    (fssData||[]).filter(f=>f.situation==="Arrivée"&&f.dateEvt&&f.dateEvt>=today&&!f.cloture)
  ,[fssData,today]);

  // ── FSS : futurs départs (situation=Départ, dateEvt >= aujourd'hui)
  const fssDeparts=useMemo(()=>
    (fssData||[]).filter(f=>f.situation==="Départ"&&f.dateEvt&&f.dateEvt>=today&&!f.cloture)
  ,[fssData,today]);

  // ── Existence "toutes dates confondues" (pas seulement les dates à venir) pour détecter les vraies
  // incohérences : une fiche FSS déjà clôturée ou une date passée ne doit PAS être signalée comme
  // "collaborateur inexistant" — la personne existe bel et bien, son dossier n'est juste plus "à venir".
  const allBadgeKeys=useMemo(()=>{const s=new Set();badges.forEach(b=>{if(b.statut!=="Archivé")s.add(keyOf(b.nom,b.prenom));});return s;},[badges]);
  const allFssArriveeKeys=useMemo(()=>{const s=new Set();(fssData||[]).forEach(f=>{if(f.situation==="Arrivée")s.add(keyOf(f.nom,f.prenom));});return s;},[fssData]);
  const allFssDepartKeys=useMemo(()=>{const s=new Set();(fssData||[]).forEach(f=>{if(f.situation==="Départ")s.add(keyOf(f.nom,f.prenom));});return s;},[fssData]);

  // ── Fusion Collaborateurs + Field Support par personne (nom+prénom), pour repérer les incohérences ──
  // Une personne présente d'un seul côté (badge sans AUCUNE fiche FSS, ou fiche FSS sans AUCUN badge,
  // en comptant toutes les dates/statuts) est marquée ⚠️. La table n'affiche que les lignes à venir,
  // mais l'existence est vérifiée sur l'ensemble des données pour éviter les faux positifs.
  const mergeSide=(badgeList,fssList,dateFieldBadge,fssExistKeys)=>{
    const map={};
    badgeList.forEach(b=>{
      const k=keyOf(b.nom,b.prenom);
      map[k]={key:k,nom:b.nom,prenom:b.prenom,matricule:b.matricule||"",manager:b.manager,date:b[dateFieldBadge],statut:b.statut,hasBadge:true,hasFss:fssExistKeys.has(k)};
    });
    fssList.forEach(f=>{
      const k=keyOf(f.nom,f.prenom);
      if(map[k]){
        map[k].hasFss=true;
        if(!map[k].date)map[k].date=f.dateEvt;
        if(!map[k].manager)map[k].manager=f.manager;
      }else{
        map[k]={key:k,nom:f.nom,prenom:f.prenom,matricule:"",manager:f.manager,date:f.dateEvt,statut:f.statut||"A traiter",hasBadge:allBadgeKeys.has(k),hasFss:true};
      }
    });
    return Object.values(map).sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  };
  const arrivees=useMemo(()=>mergeSide(futuresArrivees,fssArrivees,"date_entree",allFssArriveeKeys),[futuresArrivees,fssArrivees,allFssArriveeKeys,allBadgeKeys]);
  const departs=useMemo(()=>mergeSide(futursDeparts,fssDeparts,"date_sortie_prevue",allFssDepartKeys),[futursDeparts,fssDeparts,allFssDepartKeys,allBadgeKeys]);
  const mismatchCount=list=>list.filter(m=>!(m.hasBadge&&m.hasFss)).length;

  // ── Résoudre une incohérence : créer la fiche manquante (FSS ou badge) et ouvrir directement pour compléter ──
  const resolveMismatch=(m,category)=>{
    if(!m.hasFss){
      const situation=category==="arrivee"?"Arrivée":"Départ";
      const row={nom:m.nom,prenom:m.prenom,situation,statut:"A traiter",lieu:"",dateEvt:m.date||today,manager:m.manager||"",matPC:"",ritm:"",matRecu:"",idMat:"",dateRecep:"",matDonne:"",commentaires:"",cloture:false,is_new:true};
      const tmpId="tmp_"+Date.now();
      setFssData(prev=>[...(prev||[]),{...row,id:tmpId}]);
      if(sb){
        sb.from("lp24_fss").insert([row]).select().then(({data,error})=>{
          if(!error&&data&&data[0])setFssData(p=>(p||[]).map(f=>f.id===tmpId?data[0]:f));
        });
      }
      if(addLog)addLog("Fiche FSS créée (Rapport)",m.prenom+" "+m.nom);
      if(showToast)showToast("✅ Fiche Field Support créée — "+m.prenom+" "+m.nom+", à compléter");
      if(setView)setView("field_support");
      if(setPendingOpen)setPendingOpen({view:"field_support",id:tmpId});
    }else if(!m.hasBadge){
      const nb={id:nxId(badges),nom:m.nom,prenom:m.prenom,matricule:"",email:"",serie:"",zeplug:"",carte_rechargement:"",
        casier:"",manager:m.manager||"",mail_manager:"",statut:category==="depart"?"À récupérer":"Actif",badge_donne:false,
        date_entree:category==="arrivee"?(m.date||today):"",date_sortie_prevue:category==="depart"?(m.date||today):"",
        date_archive:"",commentaire:"",date_ajout:todayISO(),etiquette_imprimee:false};
      setBadges(p=>[...p,nb]);
      if(sb){const{id,...row}=nb;sbFire(sb.from("lp24_badges").insert(row).select("id").single(),"collaborateur").then(r=>{if(r&&r.data&&r.data.id!=null&&r.data.id!==nb.id)setBadges(p=>p.map(x=>x===nb||(x.id===nb.id&&x.nom===nb.nom)?{...x,id:r.data.id}:x));});}
      if(addLog)addLog("Badge créé (Rapport)",m.prenom+" "+m.nom);
      if(showToast)showToast("✅ Badge collaborateur créé — "+m.prenom+" "+m.nom+", à compléter");
      if(setView)setView("collaborateurs");
      if(setPendingOpen)setPendingOpen({view:"collaborateurs",id:nb.id});
    }
  };

  const Panel=({title,color,count,children})=>React.createElement("div",{style:{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:"var(--radius-lg)",overflow:"hidden"}},
    React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",borderBottom:"2px solid "+color}},
      React.createElement("h2",{style:{fontSize:15,fontWeight:800,margin:0,color}},title),
      React.createElement("span",{style:{background:color+"22",color,borderRadius:999,fontSize:11,fontWeight:700,padding:"2px 10px"}},count+" entrée"+(count>1?"s":""))
    ),
    count===0
      ?React.createElement("div",{style:{textAlign:"center",padding:"24px 0",color:"var(--text3)",fontSize:13}},"Aucune entrée à venir")
      :React.createElement("div",{style:{overflowX:"auto"}},children)
  );

  // ── Toutes les cellules ont la même hauteur fixe et ne passent jamais à la ligne ──
  const tblStyle={width:"100%",borderCollapse:"collapse",fontSize:12,tableLayout:"fixed"};
  const tdS={height:36,padding:"0 10px",borderBottom:"1px solid var(--border)",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",verticalAlign:"middle"};
  const thS={padding:"8px 10px",fontSize:10,fontWeight:700,color:"var(--text2)",textAlign:"left",
    textTransform:"uppercase",letterSpacing:".4px",borderBottom:"1px solid var(--border)",
    background:"var(--surface2)",whiteSpace:"nowrap"};

  // Pastilles compactes (icône seule + info-bulle) pour ne jamais déborder de la colonne Source.
  const Pill=(ok,icon,label)=>React.createElement("span",{key:label,title:label,style:{display:"inline-flex",alignItems:"center",
    justifyContent:"center",width:22,height:18,borderRadius:6,fontSize:11,fontWeight:700,marginRight:4,
    background:ok?"rgba(22,163,74,.15)":"rgba(220,38,38,.12)",filter:ok?"none":"grayscale(1) opacity(.55)"}},icon);

  // Colonne Action dédiée pour le bouton d'incohérence : jamais tronquée par le texte de la colonne Source.
  const renderTable=(list,color,category)=>React.createElement("table",{style:tblStyle},
    React.createElement("colgroup",null,
      React.createElement("col",{style:{width:"23%"}}),
      React.createElement("col",{style:{width:"11%"}}),
      React.createElement("col",{style:{width:"14%"}}),
      React.createElement("col",{style:{width:"18%"}}),
      React.createElement("col",{style:{width:"13%"}}),
      React.createElement("col",{style:{width:"21%"}})
    ),
    React.createElement("thead",null,React.createElement("tr",null,
      ["Nom Prénom","Matricule","Source","Manager","Date",""].map(h=>React.createElement("th",{key:h||"action",style:thS},h))
    )),
    React.createElement("tbody",null,list.map((m,i)=>{
      const mismatch=!(m.hasBadge&&m.hasFss);
      return React.createElement("tr",{key:m.key,style:{background:i%2===0?"transparent":"var(--surface2)",
        boxShadow:mismatch?"inset 3px 0 0 #D97706":"none"}},
        React.createElement("td",{style:{...tdS,fontWeight:700}},m.prenom+" "+m.nom),
        React.createElement("td",{style:{...tdS,color:"var(--text2)"}},m.matricule||"—"),
        React.createElement("td",{style:{...tdS,overflow:"visible"}},
          Pill(m.hasBadge,"🪪","Badge collaborateur"+(m.hasBadge?" ✓":" — manquant")),
          Pill(m.hasFss,"🎫","Fiche Field Support"+(m.hasFss?" ✓":" — manquante"))
        ),
        React.createElement("td",{style:{...tdS,color:"var(--text2)"}},m.manager||"—"),
        React.createElement("td",{style:{...tdS,fontWeight:600,color}},fmtD(m.date)),
        React.createElement("td",{style:{...tdS,overflow:"visible",textAlign:"right"}},
          mismatch&&React.createElement("button",{key:"w",
            onClick:()=>resolveMismatch(m,category),
            title:(m.hasBadge?"Créer la fiche Field Support manquante":"Créer le badge collaborateur manquant"),
            style:{display:"inline-flex",alignItems:"center",gap:4,color:"#D97706",fontSize:11,fontWeight:700,
              background:"rgba(217,119,6,.12)",border:"1px solid rgba(217,119,6,.35)",borderRadius:999,
              padding:"3px 9px",cursor:"pointer",whiteSpace:"nowrap"}},"⚠️ Créer")
        )
      );
    }))
  );

  return React.createElement("div",null,
    // Header
    React.createElement("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24,flexWrap:"wrap",gap:8}},
      React.createElement("div",null,
        React.createElement("h1",{style:{fontSize:22,fontWeight:800,margin:0}},"📊 Rapport — Événements à venir"),
        React.createElement("p",{style:{fontSize:12,color:"var(--text2)",marginTop:4}},
          "À partir d'aujourd'hui : "+fmtD(today)+" — Collaborateurs et Field Support fusionnés, ⚠️ = présent d'un seul côté (clique dessus pour créer la fiche manquante)")
      ),
      React.createElement("button",{onClick:()=>window.print(),
        style:{background:"var(--accentBg)",border:"1px solid var(--accent)",color:"var(--accent2)",
          borderRadius:"var(--radius)",padding:"8px 16px",fontSize:12,fontWeight:600,cursor:"pointer"}},
        "🖨️ Imprimer / PDF")
    ),

    // KPIs
    React.createElement("div",{className:"m-grid-2",style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:24}},
      [{label:"Arrivées",val:arrivees.length,color:"#16A34A"},
       {label:"Départs",val:departs.length,color:"#DC2626"},
       {label:"Incohérences arrivées",val:mismatchCount(arrivees),color:"#D97706"},
       {label:"Incohérences départs",val:mismatchCount(departs),color:"#D97706"},
      ].map(k=>React.createElement("div",{key:k.label,style:{background:"var(--surface)",border:"1px solid var(--border)",
        borderTop:"3px solid "+k.color,borderRadius:"var(--radius-lg)",padding:"14px 18px",textAlign:"center"}},
        React.createElement("div",{style:{fontSize:28,fontWeight:800,color:k.color,lineHeight:1}},k.val),
        React.createElement("div",{style:{fontSize:11,fontWeight:600,color:"var(--text2)",marginTop:5,textTransform:"uppercase",letterSpacing:".4px"}},k.label)
      ))
    ),

    // ── Deux tableaux côte à côte : Arrivées | Départs ──
    React.createElement("div",{className:"rapport-cols",style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:20}},
      React.createElement(Panel,{title:"🟢 Arrivées",color:"#16A34A",count:arrivees.length},
        renderTable(arrivees,"#16A34A","arrivee")
      ),
      React.createElement(Panel,{title:"🔴 Départs",color:"#DC2626",count:departs.length},
        renderTable(departs,"#DC2626","depart")
      )
    )
  );
}


// ── Barre de progression FSS ──
const FSS_STEPS={
  "Arrivée":["Reçu","En cours","Matériel commandé","Livré","Clôturé"],
  "Départ":["Reçu","En cours","Matériel récupéré","Badge rendu","Clôturé"],
};
function FssProgressBar({situation,statut,onStepClick}){
  const steps=FSS_STEPS[situation]||FSS_STEPS["Arrivée"];
  // Mapping statut FSS → index step
  const statutToStep={
    "A traiter":0,
    "En cours":1,
    "Matériel commandé":2,"Matériel récupéré":2,
    "Livré":3,"Badge rendu":3,
    "Terminée":4,
  };
  const current=statutToStep[statut]??0;
  return React.createElement("div",{style:{margin:"16px 0"}},
    React.createElement("div",{style:{display:"flex",alignItems:"center",gap:0,position:"relative"}},
      steps.map((step,i)=>{
        const done=i<current;
        const active=i===current;
        const color=done||active?"var(--accent2)":"var(--text3)";
        const bg=done?"var(--accent2)":active?"var(--accentBg)":"var(--surface2)";
        const border=done||active?"var(--accent2)":"var(--border)";
        return React.createElement("div",{key:step,style:{display:"flex",flexDirection:"column",alignItems:"center",flex:1,position:"relative",cursor:onStepClick?"pointer":"default"},
          onClick:onStepClick?()=>onStepClick(step,i):undefined},
          // Ligne connectrice gauche
          i>0&&React.createElement("div",{style:{
            position:"absolute",top:11,right:"50%",left:"-50%",height:2,
            background:done?"var(--accent2)":"var(--border)",zIndex:0,transition:"background .3s"
          }}),
          // Cercle
          React.createElement("div",{style:{
            width:22,height:22,borderRadius:"50%",border:"2px solid "+border,
            background:done?"var(--accent2)":active?"var(--accentBg)":"var(--surface)",
            display:"flex",alignItems:"center",justifyContent:"center",
            fontSize:10,fontWeight:700,color:done?"#fff":color,
            position:"relative",zIndex:1,transition:"all .3s",
            boxShadow:active?"0 0 0 3px var(--accentBg)":"none"
          }},done?"✓":i+1),
          // Label
          React.createElement("div",{style:{
            fontSize:9,fontWeight:active?700:500,color:active?"var(--accent2)":done?"var(--text2)":"var(--text3)",
            marginTop:5,textAlign:"center",lineHeight:1.2,maxWidth:60
          }},step)
        );
      })
    )
  );
}

  const appDep=row=>{const nom=(row["Nom"]||"").toUpperCase().trim();const prenom=(row["Prénom"]||"").trim();const dateEvt=fmtFR(row["Date événement "]||row["Date événement"]||"");const c=badges.find(b=>b.nom===nom&&b.prenom.toLowerCase()===prenom.toLowerCase()&&b.statut!=="Archivé");if(!c){showToast("⚠️ "+prenom+" "+nom+" introuvable","err");return;}const u={...c,date_sortie_prevue:dateEvt||todayISO()};setBadges(p=>p.map(b=>b.id===c.id?u:b));addLog("Départ (MS Lists)",prenom+" "+nom+(dateEvt?" le "+dateEvt:""));setProcessed(p=>new Set([...p,row._idx]));showToast("✅ Départ : "+prenom+" "+nom);};

// ════════ IMPRESSION DÉDIÉE — fenêtre séparée, dimensions exactes Avery L4785 ════════
function doPrintEtiquettes(toPrint, startPos, IMG_BG, IMG_LOGO, BLUE){
  // AVERY L4785 : marges top=13.42mm bottom=11.45mm left=19.70mm right=7.87mm
  // Étiquettes  : 80mm × 50mm | écart col=15mm | écart ligne=5.53mm
  const slots = [];
  for(let i=0;i<startPos;i++) slots.push(null);
  toPrint.forEach(b => slots.push(b));
  const PER_PAGE = 10;
  const total = Math.ceil(slots.length / PER_PAGE) * PER_PAGE || PER_PAGE;
  while(slots.length < total) slots.push(null);

  const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const etiqHTML = b => {
    if(!b) return `<div style="width:80mm;min-width:80mm;height:50mm;flex-shrink:0"></div>`;
    const prenom = esc(b.prenom);
    const nom    = esc(b.nom);
    const mat    = b.matricule && String(b.matricule)!=='0' ? esc(b.matricule) : 'NC';
    return `<div style="width:80mm;min-width:80mm;height:50mm;flex-shrink:0;position:relative;overflow:hidden;background-color:#f8f8f8">
  <img src="${IMG_BG}" style="position:absolute;top:0;left:0;width:83mm;height:53mm;display:block">
  <img src="${IMG_LOGO}" style="position:absolute;top:1.64mm;left:29.10mm;width:43.59mm;height:14.01mm;object-fit:contain">
  <div style="position:absolute;bottom:4mm;left:5mm;right:2mm">
    <div style="font-weight:bold;font-size:16pt;font-family:Arial,sans-serif;color:#002E8A;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${prenom}</div>
    <div style="font-weight:bold;font-size:16pt;font-family:Arial,sans-serif;color:#002E8A;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nom}</div>
    <div style="height:3mm"></div>
    <div style="font-weight:bold;font-style:italic;font-size:12pt;font-family:Arial,sans-serif;color:#002E8A">Matricule : ${mat}</div>
  </div>
</div>`;
  };
  let pagesHTML = '';
  for(let p=0; p<slots.length/PER_PAGE; p++){
    const sl = slots.slice(p*PER_PAGE, (p+1)*PER_PAGE);
    let inner = '';
    for(let r=0; r<5; r++){
      inner += `<div style="display:flex;flex-direction:row;align-items:flex-start">${etiqHTML(sl[r*2])}<div style="width:15mm;min-width:15mm;height:50mm;flex-shrink:0"></div>${etiqHTML(sl[r*2+1])}</div>`;
      if(r<4) inner += `<div style="height:5.53mm;font-size:0;line-height:0"></div>`;
    }
    pagesHTML += `<div style="width:210mm;height:297mm;padding:10.42mm 7.87mm 11.45mm 15.70mm;box-sizing:border-box;overflow:hidden;page-break-after:always">${inner}</div>`;
  }

  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@page{size:210mm 297mm;margin:0mm}
*{margin:0;padding:0;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
html,body{width:210mm;min-height:297mm;background:#fff}
div[style*="background-image"]{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
</style></head><body>${pagesHTML}
<script>window.addEventListener('load',function(){setTimeout(function(){window.print();},1500);});<\/script>
</body></html>`;

  const w = window.open('','_blank');
  if(!w){alert('⚠️ Autorisez les popups pour imprimer.');return;}
  w.document.open();
  w.document.write(html);
  w.document.close();
}

// ── Parse FSS CSV ──
function parseFSSCsv(text, existingFss){
  const lines=text.split(/\r?\n/);if(lines.length<2)return[];
  const sep=lines[0].includes(";")?";":",";
  const parseRow=line=>{const cols=[];let cur="";let inQ=false;for(const ch of line){if(ch==='"')inQ=!inQ;else if(ch===sep&&!inQ){cols.push(cur.replace(/^"|"$/g,"").trim());cur="";}else cur+=ch;}cols.push(cur.replace(/^"|"$/g,"").trim());return cols;};
  const rawHeaders=parseRow(lines[0]);
  const headers=rawHeaders.map(h=>h.replace(/^\uFEFF/,"").replace(/^"+|"+$/g,"").trim());
  const result=[];let nextId=Math.max(0,...(existingFss||[]).map(f=>f.id||0))+1;
  lines.slice(1).filter(l=>l.trim()).forEach(line=>{
    const cols=parseRow(line);const o={};headers.forEach((h,i)=>{o[h]=cols[i]||"";});
    const nom=String(o["Nom"]||"").trim().toUpperCase();const prenom=String(o["Prénom"]||"").trim();
    if(!nom&&!prenom)return;
    const situation=String(o["Situation collaborateur"]||"").trim();
    const statut=String(o["Statut demande pour le FSS"]||"").trim();
    const lieu=String(o["Localisation"]||o['\uFEFF"Localisation"']||"").trim().replace(/^"+|"+$/g,"");
    const dateEvt=normDate(String(o["Date événement "]||o["Date événement"]||"").trim());
    const manager=String(o["Manager de l'embauché(e)"]||"").trim();
    const matPC=String(o["Demande de matériel en cours ? (PC)"]||"").trim();
    const ritm=String(o["N° RITM (plusieurs possibles)"]||"").trim();
    const matRecu=String(o["Materiel reçu au FSS local ? "]||o["Materiel reçu au FSS local ?"]||"").trim();
    const idMat=String(o["ID materiel (départ collab uniquement)"]||"").trim();
    const dateRecep=normDate(String(o["Date de réception "]||o["Date de réception"]||"").trim());
    const matDonne=String(o["Matériel donné au client ?  (Arrivés uniquement)"]||"").trim();
    const commentaires=String(o["Commentaires"]||"").trim();
    const isCloture=statut==="Terminée";
    result.push({id:nextId++,nom,prenom,situation,statut,lieu,dateEvt,manager,matPC,ritm,matRecu,idMat,dateRecep,matDonne,commentaires,cloture:isCloture});
  });
  return result;
}

// ── Portal : rend la modale directement sur document.body ──
function Portal({children}){
  const[el]=React.useState(()=>document.createElement("div"));
  React.useEffect(()=>{
    document.body.appendChild(el);
    return()=>document.body.removeChild(el);
  },[el]);

}

    if(!d||d==="null"||d==="undefined")return"—";
    const s=String(d).trim();
    // Format ISO yyyy-mm-dd
    if(/^\d{4}-\d{2}-\d{2}$/.test(s))return new Date(s+"T00:00:00").toLocaleDateString("fr-FR");
    // Format français dd/mm/yyyy
    if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){const[dd,mm,yyyy]=s.split("/");return new Date(yyyy+"-"+mm+"-"+dd+"T00:00:00").toLocaleDateString("fr-FR");}

// ════════════════ VUE BADGES DE PRÊT ════════════════
function VueBadgesPret({showToast,addLog}){
  const el=React.createElement;
  const{useState,useMemo,useEffect,useCallback}=React;

  const INITIAL_BADGES=[
    {id:1,code:"P001",nom:"Badge Prêt 1",statut:"disponible",emprunteur:"",date_emprunt:"",date_retour_prevu:"",commentaire:""},
    {id:2,code:"P002",nom:"Badge Prêt 2",statut:"disponible",emprunteur:"",date_emprunt:"",date_retour_prevu:"",commentaire:""},
    {id:3,code:"P003",nom:"Badge Prêt 3",statut:"disponible",emprunteur:"",date_emprunt:"",date_retour_prevu:"",commentaire:""},
    {id:4,code:"P004",nom:"Badge Prêt 4",statut:"disponible",emprunteur:"",date_emprunt:"",date_retour_prevu:"",commentaire:""},
    {id:5,code:"P005",nom:"Badge Prêt 5",statut:"disponible",emprunteur:"",date_emprunt:"",date_retour_prevu:"",commentaire:""},
    {id:6,code:"P006",nom:"Badge Prêt 6",statut:"disponible",emprunteur:"",date_emprunt:"",date_retour_prevu:"",commentaire:""},
    {id:7,code:"P007",nom:"Badge Prêt 7",statut:"disponible",emprunteur:"",date_emprunt:"",date_retour_prevu:"",commentaire:""},
    {id:8,code:"P008",nom:"Badge Prêt 8",statut:"disponible",emprunteur:"",date_emprunt:"",date_retour_prevu:"",commentaire:""},
    {id:9,code:"P009",nom:"Badge Prêt 9",statut:"disponible",emprunteur:"",date_emprunt:"",date_retour_prevu:"",commentaire:""},
    {id:10,code:"P010",nom:"Badge Prêt 10",statut:"disponible",emprunteur:"",date_emprunt:"",date_retour_prevu:"",commentaire:""},
  ];

  const S={
    disponible:{label:"Disponible",color:"#16A34A",bg:"rgba(22,163,74,.12)",border:"rgba(22,163,74,.3)"},
    prete:{label:"Prêtée",color:"#D97706",bg:"rgba(217,119,6,.12)",border:"rgba(217,119,6,.3)"},
    empruntee:{label:"Empruntée",color:"#DC2626",bg:"rgba(220,38,38,.12)",border:"rgba(220,38,38,.3)"},
  };

  const fmtDate=d=>d?new Date(d).toLocaleDateString("fr-FR"):"—";
  const todayISO=()=>new Date().toISOString().slice(0,10);

  const[badges,setBadges]=useState(INITIAL_BADGES);
  const[search,setSearch]=useState("");
  const[filtreStatut,setFiltreStatut]=useState("");
  const[annuaire,setAnnuaire]=useState([]);
  const[selected,setSelected]=useState(null);
  const[loading,setLoading]=useState(true);
  const[saving,setSaving]=useState(false);

  // Chargement Supabase
  useEffect(()=>{
    if(!sb){setLoading(false);return;}
    (async()=>{
      try{
        const r=await sb.from("badges_pret").select("*").order("id");
        if(!r.error&&r.data&&r.data.length>0)setBadges(r.data);
        const c=await sb.from("lp24_badges").select("nom,prenom,email,statut");
        if(!c.error&&c.data)setAnnuaire(c.data.filter(x=>x.statut!=="Archivé"&&(x.nom||x.prenom)));
      }catch(e){}
      setLoading(false);
    })();
  },[]);

  const save=useCallback(async(list)=>{
    if(!sb)return;
    setSaving(true);
    try{for(const b of list)await sb.from("badges_pret").upsert(b,{onConflict:"id"});}catch(e){}
    setSaving(false);
  },[]);

  const stats=useMemo(()=>({
    total:badges.length,
    disponibles:badges.filter(b=>b.statut==="disponible").length,
    pretees:badges.filter(b=>b.statut==="prete").length,
    empruntees:badges.filter(b=>b.statut==="empruntee").length,
  }),[badges]);

  const filtered=useMemo(()=>{
    let r=badges;
    if(search.trim()){const q=search.toLowerCase();r=r.filter(b=>b.code.toLowerCase().includes(q)||b.nom.toLowerCase().includes(q)||(b.emprunteur&&b.emprunteur.toLowerCase().includes(q)));}
    if(filtreStatut)r=r.filter(b=>b.statut===filtreStatut);
    return r;
  },[badges,search,filtreStatut]);

  const doAction=(badgeId,newStatut,emprunteur,dateRetour,emailEmp)=>{
    const old=badges.find(b=>b.id===badgeId);
    const now=todayISO();
    const updated=badges.map(b=>{
      if(b.id!==badgeId)return b;
      return{...b,statut:newStatut,
        emprunteur:newStatut==="disponible"?"":(emprunteur||b.emprunteur),
        date_emprunt:newStatut==="disponible"?"":((b.statut==="disponible"||!b.date_emprunt)?now:b.date_emprunt),
        email_emprunteur:newStatut==="disponible"?"":String(emailEmp!=null?emailEmp:(b.email_emprunteur||"")).trim(),
        date_retour_prevu:newStatut==="disponible"?"":(dateRetour||b.date_retour_prevu),
      };
    });
    setBadges(updated);
    save(updated);
    // Enregistrer dans l'historique des prêts
    if(sb){const ligne={badge_code:old?.code||"",badge_nom:old?.nom||"",action:newStatut==="disponible"?"retour":"pret",emprunteur:emprunteur||old?.emprunteur||"",date_emprunt:now,date_retour_prevu:dateRetour||"",ts:new Date().toISOString()};sb.from("badges_pret_histo").insert([ligne]).then(r=>{if(r.error)console.error("HISTO INSERT ERROR:",JSON.stringify(r.error));else console.log("HISTO OK",ligne);}).catch(e=>console.error("HISTO CATCH:",e));}
    if(addLog)addLog("Badge prêt",`${old?.code} → ${S[newStatut]?.label}`);
    showToast(`${old?.code} — ${S[newStatut]?.label}`);
    setSelected(null);
  };

  const updateField=(badgeId,field,val)=>{
    const updated=badges.map(b=>b.id===badgeId?{...b,[field]:val}:b);
    setBadges(updated);
    return updated;
  };

  if(loading)return el("div",{style:{textAlign:"center",padding:60,color:"var(--text2)"}},
    el("div",{style:{fontSize:32,marginBottom:8}},"🔄"),
    el("div",{style:{fontSize:14}},"Chargement des badges...")

  const load=useCallback(async()=>{

  const[settings,setSettings]=useState({fssEmail:"",restaurantEmail:"placedeseine@11h59.fr",ccEmails:"a.avonde@allianceautomotive.fr,ju.poitier@allianceautomotive.fr",itEmail:"",users:[],bodyArriveeResto:"Bonjour,\n\nNous vous informons de l'arrivée d'un nouveau collaborateur :\n\nNom : {nom}\nPrénom : {prenom}\nMatricule : {matricule}\nEmail : {email}\nDate d'entrée : {date_entree}\nManager : {manager}\n\nMerci de bien vouloir l'ajouter à vos systèmes.\n\nCordialement",bodyArriveeIT:"Bonjour,\n\nNous vous informons de l'arrivée d'un nouveau collaborateur :\n\nNom : {nom}\nPrénom : {prenom}\nMatricule : {matricule}\nEmail : {email}\nDate d'entrée : {date_entree}\nManager : {manager} ({mail_manager})\n\nMerci de créer les accès nécessaires.\n\nCordialement",bodyDepartResto:"Bonjour,\n\nNous vous informons du départ du collaborateur suivant :\n\nNom : {nom}\nPrénom : {prenom}\nMatricule : {matricule}\nN° badge : {serie}\nDate de départ : {date_sortie_prevue}\nManager : {manager}\n\nMerci de bien vouloir le retirer de vos systèmes.\n\nCordialement,\nArnaud AVONDE\n07.85.42.37.24\nResponsable de site",bodyDepartIT:"Bonjour,\n\nNous vous informons du départ du collaborateur suivant :\n\nNom : {nom}\nPrénom : {prenom}\nMatricule : {matricule}\nN° badge : {serie}\nDate de sortie : {date_sortie_prevue}\nManager : {manager} ({mail_manager})\n\nMerci de supprimer les accès.\n\nCordialement"});
  const[showSettings,setShowSettings]=useState(false);
  const[settingsInitialTab,setSettingsInitialTab]=useState("emails");
  const openSettingsTab=useCallback(t=>{setSettingsInitialTab(t);setShowSettings(true);},[]);
  // ── Ouverture ciblée d'une fiche depuis le Rapport (résolution d'incohérence) ──
  const[pendingOpen,setPendingOpen]=useState(null); // {view:"collaborateurs"|"field_support", id}
  const[dbStatus,setDbStatus]=useState("loading");
  // ── Casiers : la fiche collaborateur fait foi. Si un collaborateur actif a le casier X,
  // X est affiché "Occupé" à son nom, même si la ligne casier en base dit encore "Libre". ──
  const casiersEff=useMemo(()=>{
    const m={};badges.forEach(b=>{if(b.statut!=="Archivé"&&b.casier)m[casierKey(b.casier)]=b;});
    return casiers.map(c=>{
      const b=m[casierKey(c.numero)];if(!b)return c;
      const occ=(b.nom||"")+" "+(b.prenom||"");
      const mat=String(b.matricule||c.matricule||"");
      if(c.statut==="Occupé"&&String(c.occupant||"").toUpperCase()===occ.toUpperCase()&&String(c.matricule||"")===mat)return c;
      return{...c,statut:"Occupé",occupant:occ,matricule:mat};
    });
  },[badges,casiers]);
  const repairRef=useRef(new Set());
  const[loading,setLoading]=useState(false);
  const[toast,setToast]=useState(null);
  const toastTimer=useRef(null);
  const racineRef=useRef(null);const hrRef=useRef(null);const hcmRef=useRef(null);const importJsonRef=useRef(null);
  
  // ── Auto-save ──
  const saveTimer=useRef(null);
  // Dernier état connu de chaque fiche côté base (id → contenu). La sauvegarde automatique
  // n'envoie que les fiches qui diffèrent de cet état : elle n'écrase plus les modifications
  // faites entre-temps par quelqu'un d'autre sur les fiches qu'on n'a pas touchées.
  const serverSnap=useRef({});const pendingSave=useRef(false);
  const snapBadges=list=>{const m={};(list||[]).forEach(b=>{if(b&&typeof b.id==="number")m[b.id]=JSON.stringify(b);});serverSnap.current=m;};
  const[saving,setSaving]=useState(false);

  // ── Auto-save badges — uniquement les badges avec un vrai ID Supabase (number) ──
  useEffect(()=>{
    if(!unlocked||!sb||!badges.length)return;
    if(saveTimer.current)clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(()=>{
      saveTimer.current=null;
      // FIX: ne jamais upsert les badges avec ID temporaire (string "tmp_...") ou ID local hors Supabase
      const rows=badges.filter(b=>b.id&&typeof b.id==="number"&&serverSnap.current[b.id]!==JSON.stringify(b));
      if(!rows.length)return;
      setSaving(true);pendingSave.current=true;
      (async()=>{try{
        const rs=await Promise.all(rows.map(b=>sb.from("lp24_badges").upsert(b,{onConflict:"id"})));
        rows.forEach((b,i)=>{if(!(rs[i]&&rs[i].error))serverSnap.current[b.id]=JSON.stringify(b);});
        if(rs.some(r=>r&&r.error))showToast("⚠️ Pas sauvegardé (collaborateur) — vérifie le réseau et réessaie","err");
        setTimeout(()=>setSaving(false),800);
      }catch(e){setSaving(false);}finally{pendingSave.current=false;}})();
    },2000);
  },[badges,unlocked]);

  // ── Auto-transition "À récupérer" : UNIQUEMENT quand la sortie est à J-7 ──
  // Bascule dans les deux sens : Actif→À récupérer en entrant dans la fenêtre des 7 jours,
  // et À récupérer→Actif si la date de sortie a été repoussée à plus de 7 jours (la personne
  // ne part plus si vite). On ne touche jamais aux fiches sans date de sortie, ni à celles déjà
  // en retard (date passée, statut "À récupérer" conservé tant que le badge n'est pas récupéré).
  useEffect(()=>{
    if(!unlocked||!badges.length)return;
    const today=todayISO();
    const j7=new Date();j7.setDate(j7.getDate()+7);const j7ISO=j7.toISOString().slice(0,10);
    const versARecuperer=badges.filter(b=>b.statut==="Actif"&&b.date_sortie_prevue&&b.date_sortie_prevue<=j7ISO&&b.date_sortie_prevue>=today);
    const versActif=badges.filter(b=>b.statut==="À récupérer"&&b.date_sortie_prevue&&b.date_sortie_prevue>j7ISO);
    if(!versARecuperer.length&&!versActif.length)return;
    const idsRec=new Set(versARecuperer.map(b=>b.id));
    const idsAct=new Set(versActif.map(b=>b.id));

function AddUserForm({settings,setSettings,showToast}){
  const[nu,setNu]=useState({email:"",pwd:"",label:""});
  const allViews=["accueil","collaborateurs","casiers","rapport","impression","historique","archives"];
  const[blocked,setBlocked]=useState(new Set());
  const toggleBlock=v=>setBlocked(p=>{const n=new Set(p);n.has(v)?n.delete(v):n.add(v);return n;});
  const addUser=()=>{
    if(!nu.email||!nu.pwd){showToast("⚠️ Email et mot de passe requis","err");return;}
    const perms={};allViews.forEach(v=>{perms[v]=blocked.has(v)?PERM_NONE:PERM_WRITE;});
    setSettings(s=>({...s,users:[...(s.users||[]),{...nu,perms}]}));
    setNu({email:"",pwd:"",label:""});setBlocked(new Set());

}

function VueRechercheGlobale({badges,casiers,q,setView}){
  const res=React.useMemo(()=>{
    if(!q||q.length<2)return{badges:[],casiers:[]};
    const nq=norm(q);
    return{
      badges:badges.filter(b=>norm(b.nom+" "+b.prenom+" "+(b.matricule||"")+" "+(b.serie||"")).includes(nq)),
      casiers:casiers.filter(c=>norm(c.numero+" "+c.occupant+" "+c.matricule).includes(nq))
    };
  },[badges,casiers,q]);
  const tot=res.badges.length+res.casiers.length;
  return React.createElement("div",null,
    React.createElement("h1",{style:{fontSize:22,fontWeight:700,marginBottom:16}},"🔍 Résultats pour ",q),
    q.length<2?React.createElement("p",{style:{color:"#9CA3AF",textAlign:"center",padding:32}},"Saisissez au moins 2 caractères"):
    tot===0?React.createElement("p",{style:{color:"#9CA3AF",textAlign:"center",padding:32}},"Aucun résultat"):
    React.createElement("div",null,
      React.createElement("p",{style:{fontSize:13,color:"#6B7280",marginBottom:12}},tot+" résultat(s)"),
      res.badges.length>0&&React.createElement("div",{style:{background:"#fff",borderRadius:12,boxShadow:"0 1px 3px rgba(0,0,0,.08)",padding:16,marginBottom:12,borderLeft:"4px solid #0891B2"}},
        React.createElement("h3",{style:{fontWeight:700,color:"#0891B2",fontSize:14,marginBottom:10}},"👥 Collaborateurs ("+res.badges.length+")"),
        res.badges.map(b=>React.createElement("div",{key:b.id,style:{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:"1px solid #F3F4F6",cursor:"pointer"},onClick:()=>setView("collaborateurs")},
          React.createElement("span",null,React.createElement("b",null,b.nom)," ",b.prenom," ",React.createElement("span",{style:{color:"#9CA3AF",fontSize:11}},b.matricule||"")),
          React.createElement("span",{style:{background:b.statut==="Actif"?"#E6F9EE":b.statut==="Archivé"?"#F5F5F5":"#FDEDEC",color:b.statut==="Actif"?"#00B050":b.statut==="Archivé"?"#808080":"#E74C3C",borderRadius:999,fontSize:11,fontWeight:700,padding:"2px 8px"}},b.statut)
        ))

          React.createElement("span",null,React.createElement("b",{style:{color:"#7C3AED"}},c.numero)," ",c.occupant||""),
          React.createElement("span",{style:{color:"#6B7280",fontSize:12}},c.zone)

// ── Microsoft Lists CSV parser ──
function parseMSListsCSV(text){
  const lines=text.split(/\r?\n/);if(lines.length<2)return[];
  const sep=lines[0].includes(";")?";":",";
  const parseHeaders=line=>{const cols=[];let cur="";let inQ=false;for(const ch of line){if(ch==='"')inQ=!inQ;else if(ch===sep&&!inQ){cols.push(cur.replace(/^"|"$/g,"").trim());cur="";}else cur+=ch;}cols.push(cur.replace(/^"|"$/g,"").trim());return cols;};
  const parseLine=line=>{const cols=[];let cur="";let inQ=false;for(const ch of line){if(ch==='"')inQ=!inQ;else if(ch===sep&&!inQ){cols.push(cur.replace(/^"|"$/g,"").trim());cur="";}else cur+=ch;}cols.push(cur.replace(/^"|"$/g,"").trim());return cols;};
  const headers=parseHeaders(lines[0]);
  return lines.slice(1).filter(l=>l.trim()).map((line,idx)=>{const cols=parseLine(line);const o={_idx:idx};headers.forEach((h,i)=>{o[h]=cols[i]||"";});return o;});
}

  const[showForm,setShowForm]=useState(false);const[editing,setEditing]=useState(null);const[viewMode,setViewMode0]=useState(()=>{try{return localStorage.getItem("casiersView")||"liste";}catch(e){return "liste";}});

  const empty={numero:"",zone:"DE",occupant:"",matricule:"",statut:"Libre"};const[form,setForm]=useState(empty);

  // ── Lien casier ↔ collaborateur : la seule source de vérité est le champ "casier" de la fiche
  // collaborateur (attribué depuis l'onglet Collaborateurs). Un casier marqué "Occupé" dont plus
  // aucun collaborateur actif ne pointe vers lui (parti, réaffecté ailleurs...) est "à vider" —
  // il garde le nom de l'ancien occupant jusqu'à ce qu'il soit vidé manuellement.
  const badgeByCasier=useMemo(()=>{const m={};badges.forEach(b=>{if(b.statut!=="Archivé"&&b.casier)m[casierKey(b.casier)]=b;});return m;},[badges]);
  // fiches actives SANS numéro de casier, par nom : si l'occupant d'un casier y correspond, ce n'est pas « à vider »
  const badgeNoCasierByName=useMemo(()=>{const m={};badges.forEach(b=>{if(b.statut!=="Archivé"&&!String(b.casier||"").trim())m[personKey((b.nom||"")+" "+(b.prenom||""))]=b;});return m;},[badges]);
  const badgeByName=useMemo(()=>{const m={};badges.forEach(b=>{if(b.statut!=="Archivé")m[personKey((b.nom||"")+" "+(b.prenom||""))]=b;});return m;},[badges]);
  // casier « à vider » dont l'ancien occupant est toujours là, avec un autre casier sur sa fiche
  const movedTo=c=>{if(!c.occupant)return null;const b=badgeByName[personKey(c.occupant)];return b&&String(b.casier||"").trim()&&casierKey(b.casier)!==casierKey(c.numero)?b:null;};

  const findLinked=useCallback(c=>{const b=badgeByCasier[casierKey(c.numero)];if(b)return b;const n=c.occupant&&badgeNoCasierByName[personKey(c.occupant)];return n?{...n,_sansCasier:true}:null;},[badgeByCasier,badgeNoCasierByName]);

  const statCLinked=st=>({"Actif":C.green,"À récupérer":C.red,"Badge prêt":C.blue,"Badge VIP":"#7C3AED","Futur arrivant":"#0891B2"}[st]||C.gray);
  const aViderCount=useMemo(()=>casiers.filter(isAVider).length,[casiers,isAVider]);

  const viderCasier=async(c,e)=>{
    if(e)e.stopPropagation();
    if(!confirm("Vider le casier "+c.numero+" ? ("+(c.occupant||"l'ancien occupant")+" "+aViderWhy(c)+")"))return;
    const upd={...c,statut:"Libre",occupant:"",matricule:""};

        const{error}=await sb.from("lp24_casiers").upsert(upd);
        if(error){console.error("viderCasier",error);showToast("⚠️ Pas sauvegardé (réseau) — réessaie","err");return;}
      }catch(e2){console.error("viderCasier",e2);showToast("⚠️ Pas sauvegardé (réseau) — réessaie","err");return;}

        }catch(e){console.error("save casier",e);showToast("⚠️ Pas sauvegardé (réseau) — réessaie","err");return;}

      }catch(e){console.error("del casier",e);showToast("⚠️ Suppression non sauvegardée (réseau) — réessaie","err");return;}

function VueRapport({badges,fssData,setBadges,setFssData,showToast,addLog,setView,setPendingOpen}){
  const today=todayISO();
  const fmtD=d=>d?new Date(d).toLocaleDateString("fr-FR"):"—";
  const keyOf=(n,p)=>norm(n)+"|"+norm(p);

  // ── Collaborateurs : futurs départs (date_sortie_prevue >= aujourd'hui)
  const futursDeparts=useMemo(()=>
    badges.filter(b=>b.date_sortie_prevue&&b.date_sortie_prevue>=today&&b.statut!=="Archivé")
  ,[badges,today]);

  // ── Collaborateurs : futures arrivées (date_entree >= aujourd'hui)
  const futuresArrivees=useMemo(()=>
    badges.filter(b=>b.date_entree&&b.date_entree>=today&&b.statut!=="Archivé")
  ,[badges,today]);

  // ── FSS : futures arrivées (situation=Arrivée, dateEvt >= aujourd'hui)

    (fssData||[]).filter(f=>f.situation==="Arrivée"&&f.dateEvt&&f.dateEvt>=today&&!f.cloture)
  ,[fssData,today]);

  // ── FSS : futurs départs (situation=Départ, dateEvt >= aujourd'hui)

    (fssData||[]).filter(f=>f.situation==="Départ"&&f.dateEvt&&f.dateEvt>=today&&!f.cloture)

  // ── Existence "toutes dates confondues" (pas seulement les dates à venir) pour détecter les vraies

  const allFssArriveeKeys=useMemo(()=>{const s=new Set();(fssData||[]).forEach(f=>{if(f.situation==="Arrivée")s.add(keyOf(f.nom,f.prenom));});return s;},[fssData]);
  const allFssDepartKeys=useMemo(()=>{const s=new Set();(fssData||[]).forEach(f=>{if(f.situation==="Départ")s.add(keyOf(f.nom,f.prenom));});return s;},[fssData]);

      }else{

// ════════ IMPRESSION DÉDIÉE — fenêtre séparée, dimensions exactes Avery L4785 ════════
function doPrintEtiquettes(toPrint, startPos, IMG_BG, IMG_LOGO, BLUE){
  // AVERY L4785 : marges top=13.42mm bottom=11.45mm left=19.70mm right=7.87mm
  // Étiquettes  : 80mm × 50mm | écart col=15mm | écart ligne=5.53mm
  const slots = [];
  for(let i=0;i<startPos;i++) slots.push(null);
  toPrint.forEach(b => slots.push(b));
  const PER_PAGE = 10;
  const total = Math.ceil(slots.length / PER_PAGE) * PER_PAGE || PER_PAGE;
  while(slots.length < total) slots.push(null);

  const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const etiqHTML = b => {
    if(!b) return `<div style="width:80mm;min-width:80mm;height:50mm;flex-shrink:0"></div>`;
    const prenom = esc(b.prenom);
    const nom    = esc(b.nom);
    const mat    = b.matricule && String(b.matricule)!=='0' ? esc(b.matricule) : 'NC';
    return `<div style="width:80mm;min-width:80mm;height:50mm;flex-shrink:0;position:relative;overflow:hidden;background-color:#f8f8f8">
  <img src="${IMG_BG}" style="position:absolute;top:0;left:0;width:83mm;height:53mm;display:block">
  <img src="${IMG_LOGO}" style="position:absolute;top:1.64mm;left:29.10mm;width:43.59mm;height:14.01mm;object-fit:contain">
  <div style="position:absolute;bottom:4mm;left:5mm;right:2mm">
    <div style="font-weight:bold;font-size:16pt;font-family:Arial,sans-serif;color:#002E8A;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${prenom}</div>
    <div style="font-weight:bold;font-size:16pt;font-family:Arial,sans-serif;color:#002E8A;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nom}</div>
    <div style="height:3mm"></div>
    <div style="font-weight:bold;font-style:italic;font-size:12pt;font-family:Arial,sans-serif;color:#002E8A">Matricule : ${mat}</div>
  </div>
</div>`;
  };
  let pagesHTML = '';
  for(let p=0; p<slots.length/PER_PAGE; p++){
    const sl = slots.slice(p*PER_PAGE, (p+1)*PER_PAGE);
    let inner = '';
    for(let r=0; r<5; r++){
      inner += `<div style="display:flex;flex-direction:row;align-items:flex-start">${etiqHTML(sl[r*2])}<div style="width:15mm;min-width:15mm;height:50mm;flex-shrink:0"></div>${etiqHTML(sl[r*2+1])}</div>`;
      if(r<4) inner += `<div style="height:5.53mm;font-size:0;line-height:0"></div>`;
    }
    pagesHTML += `<div style="width:210mm;height:297mm;padding:10.42mm 7.87mm 11.45mm 15.70mm;box-sizing:border-box;overflow:hidden;page-break-after:always">${inner}</div>`;
  }

  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@page{size:210mm 297mm;margin:0mm}
*{margin:0;padding:0;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;color-adjust:exact!important}
html,body{width:210mm;min-height:297mm;background:#fff}
div[style*="background-image"]{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
</style></head><body>${pagesHTML}
<script>window.addEventListener('load',function(){setTimeout(function(){window.print();},1500);});<\/script>

// ── Parse FSS CSV ──
function parseFSSCsv(text, existingFss){
  const lines=text.split(/\r?\n/);if(lines.length<2)return[];
  const sep=lines[0].includes(";")?";":",";
  const parseRow=line=>{const cols=[];let cur="";let inQ=false;for(const ch of line){if(ch==='"')inQ=!inQ;else if(ch===sep&&!inQ){cols.push(cur.replace(/^"|"$/g,"").trim());cur="";}else cur+=ch;}cols.push(cur.replace(/^"|"$/g,"").trim());return cols;};
  const rawHeaders=parseRow(lines[0]);
  const headers=rawHeaders.map(h=>h.replace(/^\uFEFF/,"").replace(/^"+|"+$/g,"").trim());
  const result=[];let nextId=Math.max(0,...(existingFss||[]).map(f=>f.id||0))+1;
  lines.slice(1).filter(l=>l.trim()).forEach(line=>{
    const cols=parseRow(line);const o={};headers.forEach((h,i)=>{o[h]=cols[i]||"";});
    const nom=String(o["Nom"]||"").trim().toUpperCase();const prenom=String(o["Prénom"]||"").trim();
    if(!nom&&!prenom)return;
    const situation=String(o["Situation collaborateur"]||"").trim();
    const statut=String(o["Statut demande pour le FSS"]||"").trim();
    const lieu=String(o["Localisation"]||o['\uFEFF"Localisation"']||"").trim().replace(/^"+|"+$/g,"");
    const dateEvt=normDate(String(o["Date événement "]||o["Date événement"]||"").trim());
    const manager=String(o["Manager de l'embauché(e)"]||"").trim();
    const matPC=String(o["Demande de matériel en cours ? (PC)"]||"").trim();
    const ritm=String(o["N° RITM (plusieurs possibles)"]||"").trim();
    const matRecu=String(o["Materiel reçu au FSS local ? "]||o["Materiel reçu au FSS local ?"]||"").trim();
    const idMat=String(o["ID materiel (départ collab uniquement)"]||"").trim();
    const dateRecep=normDate(String(o["Date de réception "]||o["Date de réception"]||"").trim());
    const matDonne=String(o["Matériel donné au client ?  (Arrivés uniquement)"]||"").trim();
    const commentaires=String(o["Commentaires"]||"").trim();
    const isCloture=statut==="Terminée";
    result.push({id:nextId++,nom,prenom,situation,statut,lieu,dateEvt,manager,matPC,ritm,matRecu,idMat,dateRecep,matDonne,commentaires,cloture:isCloture});
  });
  return result;
}

// ── Portal : rend la modale directement sur document.body ──
function Portal({children}){
  const[el]=React.useState(()=>document.createElement("div"));
  React.useEffect(()=>{
    document.body.appendChild(el);
    return()=>document.body.removeChild(el);
  },[el]);
  return ReactDOM.createPortal(children,el);
}

    if(!d||d==="null"||d==="undefined")return"—";
    const s=String(d).trim();
    // Format ISO yyyy-mm-dd
    if(/^\d{4}-\d{2}-\d{2}$/.test(s))return new Date(s+"T00:00:00").toLocaleDateString("fr-FR");
    // Format français dd/mm/yyyy
    if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)){const[dd,mm,yyyy]=s.split("/");return new Date(yyyy+"-"+mm+"-"+dd+"T00:00:00").toLocaleDateString("fr-FR");}

            ))
        )

    )
  );
}


// ════════════════ APP ════════════════
function App(){
  const[unlocked,setUnlocked]=useState(false);const[session,setSession]=useState({role:"admin",label:"Admin"});

  const[fssData,setFssData]=useState([]);
  const[newMats,setNewMats]=useState(new Set());
  const[settings,setSettings]=useState({fssEmail:"",restaurantEmail:"placedeseine@11h59.fr",ccEmails:"a.avonde@allianceautomotive.fr,ju.poitier@allianceautomotive.fr",itEmail:"",users:[],bodyArriveeResto:"Bonjour,\n\nNous vous informons de l'arrivée d'un nouveau collaborateur :\n\nNom : {nom}\nPrénom : {prenom}\nMatricule : {matricule}\nEmail : {email}\nDate d'entrée : {date_entree}\nManager : {manager}\n\nMerci de bien vouloir l'ajouter à vos systèmes.\n\nCordialement",bodyArriveeIT:"Bonjour,\n\nNous vous informons de l'arrivée d'un nouveau collaborateur :\n\nNom : {nom}\nPrénom : {prenom}\nMatricule : {matricule}\nEmail : {email}\nDate d'entrée : {date_entree}\nManager : {manager} ({mail_manager})\n\nMerci de créer les accès nécessaires.\n\nCordialement",bodyDepartResto:"Bonjour,\n\nNous vous informons du départ du collaborateur suivant :\n\nNom : {nom}\nPrénom : {prenom}\nMatricule : {matricule}\nN° badge : {serie}\nDate de départ : {date_sortie_prevue}\nManager : {manager}\n\nMerci de bien vouloir le retirer de vos systèmes.\n\nCordialement,\nArnaud AVONDE\n07.85.42.37.24\nResponsable de site",bodyDepartIT:"Bonjour,\n\nNous vous informons du départ du collaborateur suivant :\n\nNom : {nom}\nPrénom : {prenom}\nMatricule : {matricule}\nN° badge : {serie}\nDate de sortie : {date_sortie_prevue}\nManager : {manager} ({mail_manager})\n\nMerci de supprimer les accès.\n\nCordialement"});
  const[showSettings,setShowSettings]=useState(false);
  const[settingsInitialTab,setSettingsInitialTab]=useState("emails");
  const openSettingsTab=useCallback(t=>{setSettingsInitialTab(t);setShowSettings(true);},[]);
  // ── Ouverture ciblée d'une fiche depuis le Rapport (résolution d'incohérence) ──
  const[pendingOpen,setPendingOpen]=useState(null); // {view:"collaborateurs"|"field_support", id}
  const[dbStatus,setDbStatus]=useState("loading");
  // ── Casiers : la fiche collaborateur fait foi. Si un collaborateur actif a le casier X,
  // X est affiché "Occupé" à son nom, même si la ligne casier en base dit encore "Libre". ──
  const casiersEff=useMemo(()=>{
    const m={};badges.forEach(b=>{if(b.statut!=="Archivé"&&b.casier)m[casierKey(b.casier)]=b;});
    return casiers.map(c=>{
      const b=m[casierKey(c.numero)];if(!b)return c;
      const occ=(b.nom||"")+" "+(b.prenom||"");
